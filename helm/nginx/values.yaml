replicaCount: 2

image: marmeladkk/nginx-image:version-4

resources:
   requests:
     cpu: "50m"
     memory: "64Mi"
   limits:
     cpu: "200m"
     memory: "128Mi"

port: 80
targetPort: 80

pvcStorage: 500Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50